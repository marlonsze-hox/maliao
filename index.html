<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#77d8ff">
  <meta name="description" content="云朵邮差：一款轻快的原创横版跳跃小游戏。收集信封，跳过史莱姆，送信到山顶！">
  <title>云朵邮差 · 跳跃冒险</title>
  <style>
    :root{color-scheme:light;--ink:#19334b;--muted:#66839a;--coral:#ff776c;--yellow:#ffd166;--mint:#43c59e;--panel:#fffdf4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#8ce0ff 0%,#d6f5ff 54%,#fff3cd 100%);color:var(--ink);font-family:ui-rounded,"Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
    .wrap{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 4px 12px}.brand{display:flex;align-items:center;gap:12px}.badge{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 5px 0 #e4f7ff}.brand h1{font-size:clamp(20px,3vw,27px);line-height:1;margin:0 0 5px;letter-spacing:.02em}.brand p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px}.pill{border:0;border-radius:999px;padding:10px 15px;font-weight:800;background:#fff;color:var(--ink);box-shadow:0 4px 0 #d8eff5;cursor:pointer}.pill:hover{transform:translateY(-1px)}.pill.sound{width:43px;padding:10px}
    .game-shell{background:#ffffffb8;border:1px solid #ffffffd9;border-radius:24px;padding:12px;box-shadow:0 18px 45px #4084a522;backdrop-filter:blur(6px)}.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 5px 11px}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{display:flex;align-items:center;gap:7px;background:#f1faff;border:1px solid #dff2fb;border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px}.stat b{font-variant-numeric:tabular-nums}.level-label{font-size:13px;color:var(--muted);font-weight:700}.stage{position:relative;border-radius:16px;overflow:hidden;background:#9be7ff;line-height:0}.stage canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#102b4422,#102b4450);padding:16px}.overlay[hidden]{display:none}.card{max-width:420px;background:#fffdf4;border:3px solid #fff;border-radius:23px;text-align:center;padding:23px 27px;line-height:1.45;box-shadow:0 12px 35px #15345133}.card .emoji{font-size:42px}.card h2{font-size:25px;margin:3px 0 5px}.card p{color:#587287;margin:0 0 17px}.primary{border:0;border-radius:13px;background:var(--coral);color:white;font:inherit;font-weight:900;padding:12px 24px;box-shadow:0 5px 0 #dd574f;cursor:pointer}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #dd574f}.hint{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 6px 2px;color:var(--muted);font-size:13px}.keycaps{display:flex;align-items:center;gap:5px}.key{background:#fff;border:1px solid #e0edf2;border-bottom-width:3px;border-radius:7px;padding:3px 7px;color:var(--ink);font-weight:800}.touch{display:none;justify-content:center;gap:12px;padding-top:12px}.touch button{width:58px;height:50px;border:1px solid #c8e8f4;border-radius:15px;background:#ffffffd9;box-shadow:0 4px 0 #bbdce9;font-size:22px;font-weight:900;color:var(--ink);touch-action:none}.touch button.jump{width:90px;background:#fff1c9;border-color:#ffe3a0}.footer{text-align:center;color:#66839a;font-size:12px;padding:12px 0 0}
    @media(max-width:650px){body{padding:12px}.top{align-items:flex-start}.brand p{max-width:210px}.pill:not(.sound){display:none}.game-shell{padding:8px;border-radius:19px}.hud{padding:2px 2px 8px}.stat{font-size:12px;padding:6px 8px}.level-label{display:none}.hint{font-size:11px}.touch{display:flex}.footer{padding-top:10px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><div class="badge">✉️</div><div><h1>云朵邮差</h1><p>跳过史莱姆，收集星星，把信送到山顶！</p></div></div><div class="top-actions"><button class="pill" id="restartTop">重新开始 ↻</button><button class="pill sound" id="soundBtn" aria-label="切换声音">🔊</button></div></header>
    <section class="game-shell" aria-label="云朵邮差游戏">
      <div class="hud"><div class="stats"><div class="stat">⭐ <b id="score">000</b></div><div class="stat">💌 <b id="mail">0 / 5</b></div><div class="stat">💛 <b id="lives">3</b></div></div><div class="level-label">第一站 · 风车山谷</div></div>
      <div class="stage"><canvas id="game" width="960" height="540" aria-label="横版跳跃游戏画面"></canvas><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="cardEmoji">📬</div><h2 id="cardTitle">准备出发了吗？</h2><p id="cardText">跑过草地、跳过黏糊糊的史莱姆，集齐 5 封信就能找到山顶的邮筒。</p><button class="primary" id="startBtn">开始冒险</button></div></div></div>
      <div class="hint"><span>收集发光的信封，踩扁史莱姆！</span><span class="keycaps"><span class="key">←</span><span class="key">→</span> 移动 <span class="key">空格</span> 跳跃</span></div>
      <div class="touch"><button id="leftBtn" aria-label="向左">◀</button><button class="jump" id="jumpBtn" aria-label="跳跃">跳跃</button><button id="rightBtn" aria-label="向右">▶</button></div>
    </section><div class="footer">小提示：踩到史莱姆头上也算一种友好的打招呼 🐌</div>
  </main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=540,scoreEl=document.getElementById('score'),mailEl=document.getElementById('mail'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay');
const keys={left:false,right:false};let state='ready',score=0,lives=3,mail=0,camera=0,last=0,tick=0,sound=true,audio;
const worldW=3100,groundY=452,gravity=.58;
const platforms=[{x:0,y:groundY,w:620,h:100},{x:720,y:groundY,w:570,h:100},{x:1400,y:groundY,w:540,h:100},{x:2050,y:groundY,w:570,h:100},{x:2730,y:groundY,w:480,h:100},{x:465,y:365,w:110,h:18},{x:865,y:350,w:125,h:18},{x:1110,y:390,w:105,h:18},{x:1550,y:360,w:125,h:18},{x:1800,y:320,w:110,h:18},{x:2170,y:375,w:125,h:18},{x:2400,y:335,w:115,h:18},{x:2810,y:370,w:115,h:18}];
const mailboxes=[{x:520,y:325},{x:940,y:310},{x:1610,y:320},{x:1850,y:280},{x:2450,y:295}];
let player,enemies,stars,particles;
function reset(){score=0;lives=3;mail=0;camera=0;mailboxes.forEach(m=>m.taken=false);player={x:70,y:groundY-42,vx:0,vy:0,w:30,h:40,grounded:false,face:1,inv:0};enemies=[{x:390,y:groundY-26,vx:1.1,alive:true,min:320,max:560},{x:980,y:groundY-26,vx:1.25,alive:true,min:790,max:1220},{x:1690,y:groundY-26,vx:1.15,alive:true,min:1450,max:1900},{x:2290,y:groundY-26,vx:1.3,alive:true,min:2110,max:2530},{x:2820,y:groundY-26,vx:1.2,alive:true,min:2750,max:3030}];stars=[];for(let i=0;i<75;i++)stars.push({x:(i*137+45)%worldW,y:210+(i*71)%125,r:2+(i%3),phase:i*.7});particles=[];hud()}
function hud(){scoreEl.textContent=String(score).padStart(3,'0');mailEl.textContent=mail+' / 5';livesEl.textContent=lives}
function beep(f=660,d=.09){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.065,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(_){}}
function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function cloud(x,y,s=1){ctx.fillStyle='#ffffffb8';ctx.beginPath();ctx.arc(x,y,23*s,0,7);ctx.arc(x+24*s,y-12*s,31*s,0,7);ctx.arc(x+54*s,y,22*s,0,7);ctx.fill()}
function drawBg(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#80dfff');sky.addColorStop(.72,'#d1f4ff');sky.addColorStop(1,'#f9f0c9');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff1a9';ctx.beginPath();ctx.arc(790,94,43,0,7);ctx.fill();for(let i=0;i<8;i++){let x=((i*220-camera*.22)%(W+140)+W+140)%(W+140)-70;cloud(x,95+(i%3)*42,.72+(i%2)*.2)}
  ctx.fillStyle='#9cdba9';ctx.beginPath();ctx.moveTo(0,365);for(let x=0;x<=W+40;x+=40)ctx.lineTo(x,310+Math.sin((x+camera*.15)*.009)*36);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#76c989';ctx.beginPath();ctx.moveTo(0,413);for(let x=0;x<=W+40;x+=40)ctx.lineTo(x,365+Math.sin((x+camera*.27)*.012)*26);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  for(let i=0;i<6;i++){const x=((i*440-camera*.48)%(W+80)+W+80)%(W+80)-40;drawWindmill(x,325+(i%2)*22,1)} }
function drawWindmill(x,y,s){ctx.strokeStyle='#b68a57';ctx.lineWidth=7*s;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+82*s);ctx.stroke();ctx.fillStyle='#fff7e7';ctx.beginPath();ctx.arc(x,y,8*s,0,7);ctx.fill();for(let i=0;i<4;i++){let a=tick*.0002+i*Math.PI/2;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#fff8e7';ctx.beginPath();ctx.roundRect(-4*s,-43*s,8*s,37*s,5*s);ctx.fill();ctx.restore()}}
function drawWorld(){drawBg();ctx.save();ctx.translate(-camera,0);
  for(const p of platforms){ctx.fillStyle='#a66a49';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#70c96d';ctx.fillRect(p.x,p.y,p.w,13);for(let x=p.x+15;x<p.x+p.w;x+=42){ctx.fillStyle='#c58558';ctx.fillRect(x,p.y+28,20,5);ctx.fillRect(x+14,p.y+65,17,5)}}
  for(const s of stars){const pulse=1+Math.sin(tick*.004+s.phase)*.13;ctx.save();ctx.translate(s.x,s.y);ctx.scale(pulse,pulse);ctx.fillStyle='#fff2a4';ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?s.r*.48:s.r;let a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
  mailboxes.forEach((m,i)=>{ctx.fillStyle=mail>i?'#f4a261':'#ff806f';ctx.fillRect(m.x,m.y+22,7,38);rect(m.x-12,m.y,34,25,5,mail>i?'#ffd166':'#ff776c');ctx.fillStyle='#fff7df';ctx.fillRect(m.x-7,m.y+6,20,4);ctx.fillStyle='#a54551';ctx.fillRect(m.x+16,m.y+2,5,6)});
  for(const e of enemies)if(e.alive)drawEnemy(e);
  drawPlayer();ctx.restore();drawGoal();
}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);let wob=Math.sin(tick*.012+e.x)*1.5;ctx.fillStyle='#8766ce';ctx.beginPath();ctx.ellipse(0,15+wob,19,12-wob,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-7,11,4,5,0,0,7);ctx.ellipse(6,11,4,5,0,0,7);ctx.fill();ctx.fillStyle='#283756';ctx.fillRect(-8,11,3,4);ctx.fillRect(5,11,3,4);ctx.strokeStyle='#5b4697';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,25);ctx.lineTo(-14,29);ctx.moveTo(9,25);ctx.lineTo(14,29);ctx.stroke();ctx.restore()}
function drawPlayer(){const p=player;ctx.save();ctx.translate(p.x,p.y);if(p.inv>0&&Math.floor(tick/75)%2===0)ctx.globalAlpha=.45;ctx.scale(p.face,1);const run=Math.abs(p.vx)>0.5&&!p.grounded?Math.sin(tick*.025)*2:0;
  // Mail carrier cap and face
  rect(-11,1,23,23,8,'#f4a261');rect(-12,-4,23,11,5,'#ef6b62');rect(-15,2,16,5,3,'#ef6b62');ctx.fillStyle='#ffedc4';ctx.beginPath();ctx.arc(0,11,1.8,0,7);ctx.fill();
  ctx.fillStyle='#253a50';ctx.beginPath();ctx.arc(5,10,1.8,0,7);ctx.fill();ctx.strokeStyle='#253a50';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(5,14,3,0,Math.PI/2);ctx.stroke();
  rect(-13,23,26,13,5,'#42b8a0');rect(-13,34+run,10,6,3,'#534a76');rect(3,34-run,10,6,3,'#534a76');rect(-15,25,8,8,3,'#ffd166');ctx.restore()}
function drawGoal(){const x=3000-camera;ctx.fillStyle='#fff8e7';ctx.fillRect(x,285,7,170);ctx.fillStyle='#ff776c';ctx.beginPath();ctx.moveTo(x+7,292);ctx.lineTo(x+69,308);ctx.lineTo(x+7,327);ctx.fill();rect(x-16,444,40,12,4,'#70c96d')}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(state!=='playing')return;tick+=dt;const p=player,speed=4.2;p.vx=(keys.right?speed:0)-(keys.left?speed:0);if(p.vx)p.face=Math.sign(p.vx);p.x=Math.max(0,Math.min(worldW-p.w,p.x+p.vx*dt/16.67));p.vy+=gravity*dt/16.67;p.y+=p.vy*dt/16.67;p.grounded=false;
  for(const plat of platforms)if(p.vy>=0&&p.x+p.w>plat.x&&p.x<plat.x+plat.w&&p.y+p.h>=plat.y&&p.y+p.h-p.vy*dt/16.67<=plat.y){p.y=plat.y-p.h;p.vy=0;p.grounded=true}
  if(p.inv>0)p.inv-=dt;if(p.y>H+20){loseLife()}
  for(const e of enemies){if(!e.alive)continue;e.x+=e.vx*dt/16.67;if(e.x<e.min||e.x>e.max)e.vx*=-1;const eb={x:e.x-17,y:e.y+3,w:34,h:23};if(overlap({x:p.x,y:p.y,w:p.w,h:p.h},eb)){if(p.vy>1&&p.y+p.h<e.y+17){e.alive=false;p.vy=-9;score+=100;hud();beep(520,.12);burst(e.x,e.y,'#fff2a4')}else if(p.inv<=0)loseLife()}}
  for(const m of mailboxes)if(!m.taken&&Math.abs((p.x+p.w/2)-m.x)<27&&Math.abs((p.y+p.h/2)-(m.y+15))<30){m.taken=true;mail++;score+=250;hud();beep(880,.14);burst(m.x,m.y,'#ffdb70')}
  camera=Math.max(0,Math.min(worldW-W,p.x-W*.36));if(p.x>2950&&mail>=5){state='won';showCard('🏆','送信成功！','五封信都平安送到啦！你是山谷里最棒的邮差。','再玩一次')}
  for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.life--}particles=particles.filter(q=>q.life>0)
}
function loseLife(){lives--;hud();beep(180,.22);if(lives<=0){state='over';showCard('💫','哎呀，摔了一跤','别担心，邮差可以再试一次！','再试一次')}else{player.x=Math.max(40,player.x-100);player.y=groundY-42;player.vy=0;player.inv=1200}}
function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.9)*5,life:28,color})}
function showCard(emoji,title,text,button){document.getElementById('cardEmoji').textContent=emoji;document.getElementById('cardTitle').textContent=title;document.getElementById('cardText').textContent=text;document.getElementById('startBtn').textContent=button;overlay.hidden=false}
function draw(){drawWorld();for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/28);ctx.fillStyle=q.color;ctx.fillRect(q.x-camera,q.y,5,5)}ctx.globalAlpha=1}
function loop(t){const dt=Math.min(35,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}
function start(){if(state==='ready'||state==='over'||state==='won'){reset()}state='playing';overlay.hidden=true;beep(540,.08)}
document.getElementById('startBtn').addEventListener('click',start);document.getElementById('restartTop').addEventListener('click',()=>{reset();state='playing';overlay.hidden=true});document.getElementById('soundBtn').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇'});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if((e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w')&&state==='playing'&&player.grounded){player.vy=-11.3;player.grounded=false;beep(420,.07)}if(e.key==='Enter'&&state!=='playing')start()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
function hold(id,key){const el=document.getElementById(id),down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up))}hold('leftBtn','left');hold('rightBtn','right');document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='playing'&&player.grounded){player.vy=-11.3;player.grounded=false;beep(420,.07)}});
reset();requestAnimationFrame(loop)
})();
</script>
</body>
</html>
